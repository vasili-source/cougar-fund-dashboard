<script>
let stocks = [];
let activeIndex = -1;

fetch("data/stocks_index.json")
  .then(r => r.json())
  .then(d => stocks = d);

const search = document.getElementById("search");
const results = document.getElementById("results");
const output = document.getElementById("output");

function rank(a, q) {
  const t = a.ticker.toLowerCase();
  const n = a.name.toLowerCase();
  if (t === q) return 0;
  if (t.startsWith(q)) return 1;
  if (n.startsWith(q)) return 2;
  if (t.includes(q)) return 3;
  if (n.includes(q)) return 4;
  return 5;
}

function render(list) {
  results.innerHTML = "";
  list.forEach((s, i) => {
    const li = document.createElement("li");
    li.textContent = `${s.ticker} — ${s.name}`;
    li.className = (i === activeIndex) ? "active" : "";
    li.onclick = () => loadValuation(s.ticker);
    results.appendChild(li);
  });
}

search.addEventListener("input", () => {
  const q = search.value.toLowerCase().trim();
  activeIndex = -1;
  if (!q) { results.innerHTML = ""; return; }

  const list = stocks
    .map(s => ({...s, _r: rank(s, q)}))
    .filter(s => s._r < 5)
    .sort((a,b) => a._r - b._r)
    .slice(0, 20);

  render(list);
});

search.addEventListener("keydown", (e) => {
  const items = results.querySelectorAll("li");
  if (!items.length) return;

  if (e.key === "ArrowDown") {
    activeIndex = (activeIndex + 1) % items.length;
    render(Array.from(items).map((li,i)=>({
      ticker: li.textContent.split(" — ")[0],
      name: li.textContent.split(" — ")[1],
      _r: i
    })));
    e.preventDefault();
  }
